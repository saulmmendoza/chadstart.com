name: Blog

port: 3000

entities:
  Admin:
    authenticable: true
    properties:
      - name

  Customer:
    authenticable: true
    properties:
      - name
      - phone

  Post:
    properties:
      - title
      - { name: content, type: text }
      - { name: published, type: boolean }
    policies:
      create:
        - { access: restricted, allow: Admin }
      read:
        - access: public
      update:
        - { access: restricted, allow: Admin }
      delete:
        - { access: restricted, allow: Admin }

  Comment:
    properties:
      - text
    belongsTo:
      - Post
    policies:
      create:
        - access: restricted
      read:
        - access: public
      update:
        - access: restricted
      delete:
        - access: restricted

files:
  uploads:
    path: ./uploads
    public: true

public:
  folder: ./public
