name: Publish SDK to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (publish with --dry-run flag)'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    name: Build & publish @chadstart/sdk
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sdk

    permissions:
      contents: read
      id-token: write  # required for npm provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build SDK
        run: node scripts/build.js

      - name: Run SDK tests
        run: node test/sdk.test.cjs

      - name: Publish to npm (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
