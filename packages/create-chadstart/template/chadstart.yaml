# chadstart.yaml
# ─────────────────────────────────────────────────────────────────────────────
# ChadStart Todo App — demonstration of a complete chadstart.yaml config.
# Shows: entities, access policies, realtime, CRUD, and functions in every
# supported runtime (js, bash, python, go, ruby, c++).
#
# To run locally:
#   npx chadstart dev
#
# To run with Docker Compose:
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

name: Todo App
port: 3000
database: ./data/todo.db

entities:
  User:
    authenticable: true
    mainProp: name
    seedCount: 5
    properties:
      - name
      - { name: email, type: email }
      - { name: password, type: password }
    policies:
      create:
        - access: public          # Anyone can sign up
      read:
        - access: restricted
          allow: User
          condition: self         # Users can only read their own profile
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: admin
      signup:
        - access: public
    validation:
      name:
        required: true
        isNotEmpty: true
        minLength: 2
        maxLength: 100
      email:
        required: true
        isEmail: true

  Todo:
    mainProp: title
    seedCount: 20
    belongsTo:
      - User
    properties:
      - title
      - { name: description, type: text }
      - { name: completed,   type: boolean, default: false }
      - { name: priority,    type: choice,  options: { values: [low, medium, high] } }
      - { name: dueDate,     type: date }
    policies:
      create:
        - { access: restricted, allow: User, condition: self }   # Set owner on create
      read:
        - { access: restricted, allow: User, condition: self }
      update:
        - { access: restricted, allow: User, condition: self }
      delete:
        - { access: restricted, allow: User, condition: self }
    validation:
      title:
        required: true
        isNotEmpty: true
        maxLength: 255
      priority:
        isOptional: true
        isIn: [low, medium, high]
