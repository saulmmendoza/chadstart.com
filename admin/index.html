<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChadStart Admin</title>
  <!-- Animate.css – entry/exit animations (served locally from node_modules) -->
  <link rel="stylesheet" href="/admin/vendor/animate.min.css"/>
  <!-- Tailwind CSS v4 browser runtime (served locally from node_modules) -->
  <script src="/admin/vendor/tailwind.js"></script>
  <!-- HTMX – server-driven table loading (served locally from node_modules) -->
  <script src="/admin/vendor/htmx.min.js"></script>
  <!-- Custom cyberpunk blue theme for Tailwind v4 -->
  <style type="text/tailwindcss">
    @theme {
      --color-cyber: #00c8ff;
      --color-cyber-dim: #0099c0;
      --color-cyber-glow: rgba(0,200,255,0.12);
      --color-ink-950: #060810;
      --color-ink-900: #090c14;
      --color-ink-800: #0d1220;
      --color-ink-700: #111827;
      --color-ink-600: #162034;
      --color-ink-border: #1e3a5f;
      --color-ink-muted: #4a6785;
    }
  </style>
  <style>
    /* ── Running glowing edge on primary buttons ──────────────────── */
    @property --glow-a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    @keyframes btn-glow { to { --glow-a: 360deg; } }
    .btn-primary {
      background: linear-gradient(#090c14,#090c14) padding-box,
        conic-gradient(from var(--glow-a),#090c14 0%,#00c8ff 25%,#0066ff 50%,#090c14 75%) border-box;
      border: 1.5px solid transparent;
      animation: btn-glow 2.5s linear infinite;
      color: #00c8ff; font-weight: 600;
      text-shadow: 0 0 10px rgba(0,200,255,.4);
    }
    .btn-primary:hover:not(:disabled) { animation-duration: 1.2s; text-shadow: 0 0 16px rgba(0,200,255,.7); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; animation-play-state: paused; }
    /* ── Sidebar nav items ────────────────────────────────────────── */
    .nav-item {
      display: block; padding: 8px 16px; font-size: .875rem; cursor: pointer;
      color: rgb(148 163 184); border-left: 2px solid transparent;
      transition: background .12s, color .12s, border-color .12s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-item:hover { background: rgba(255,255,255,.03); }
    .nav-item.active { background: rgba(0,200,255,.08); border-left-color: #00c8ff; color: #00c8ff; }
    /* ── Thin sidebar scrollbar ───────────────────────────────────── */
    .sidebar-nav { scrollbar-width: thin; scrollbar-color: #1e3a5f transparent; }
  </style>
</head>
<body class="bg-ink-950 text-slate-300 min-h-screen flex font-sans">

<!-- ── Login overlay ──────────────────────────────────────────────────── -->
<div id="login-overlay" class="fixed inset-0 bg-ink-950 flex items-center justify-center z-50 p-4">
  <div class="bg-ink-900 border border-ink-border rounded-2xl p-10 w-full max-w-sm
              shadow-[0_0_60px_rgba(0,200,255,0.07)] animate__animated animate__fadeInDown animate__faster">
    <h1 class="text-xl font-bold mb-1">⚡ ChadStart</h1>
    <p class="text-ink-muted text-sm mb-7">Sign in to the Admin UI</p>
    <div id="login-error" class="text-red-400 text-sm mb-4 hidden"></div>

    <label class="block text-xs font-semibold text-ink-muted uppercase tracking-widest mb-1.5">Collection</label>
    <select id="login-collection"
      class="w-full bg-ink-950 border border-ink-border rounded-lg text-slate-300 px-3 py-2.5 text-sm mb-4 outline-none focus:border-cyber transition-colors">
      <option value="">Loading…</option>
    </select>

    <label class="block text-xs font-semibold text-ink-muted uppercase tracking-widest mb-1.5">Email</label>
    <input type="email" id="login-email" placeholder="admin@example.com" autocomplete="email"
      class="w-full bg-ink-950 border border-ink-border rounded-lg text-slate-300 px-3 py-2.5 text-sm mb-4 outline-none focus:border-cyber transition-colors" />

    <label class="block text-xs font-semibold text-ink-muted uppercase tracking-widest mb-1.5">Password</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"
      class="w-full bg-ink-950 border border-ink-border rounded-lg text-slate-300 px-3 py-2.5 text-sm mb-6 outline-none focus:border-cyber transition-colors" />

    <button id="login-btn" onclick="doLogin()"
      class="btn-primary w-full py-2.5 px-4 rounded-lg text-sm cursor-pointer inline-flex items-center justify-center">
      <span>Sign in</span>
    </button>
  </div>
</div>

<!-- ── Mobile sidebar backdrop ────────────────────────────────────────── -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden lg:hidden" onclick="closeSidebar()"></div>

<!-- ── Sidebar ────────────────────────────────────────────────────────── -->
<aside id="sidebar"
  class="fixed inset-y-0 left-0 z-40 w-60 bg-ink-900 border-r border-ink-border flex flex-col
         -translate-x-full lg:translate-x-0 transition-transform duration-300">
  <div class="px-4 py-5 border-b border-ink-border">
    <div class="font-bold text-cyber text-lg">⚡ ChadStart</div>
    <div id="project-name" class="text-ink-muted text-xs mt-0.5">Admin</div>
  </div>

  <nav class="sidebar-nav flex-1 overflow-y-auto py-2">
    <div class="px-4 pt-2 pb-1 text-xs font-bold text-ink-muted uppercase tracking-widest">Collections</div>
    <div id="nav-user-collections"></div>
    <div class="px-4 pt-4 pb-1 text-xs font-bold text-ink-muted uppercase tracking-widest border-t border-ink-border/50 mt-2">Entities</div>
    <div id="nav-entities"></div>
  </nav>

  <div class="border-t border-ink-border px-4 py-4">
    <div class="flex items-center gap-2.5 mb-3">
      <div id="user-avatar"
        class="w-8 h-8 rounded-full bg-cyber/10 border border-cyber/30 flex items-center justify-center font-bold text-sm text-cyber shrink-0">?</div>
      <div class="min-w-0 flex-1">
        <div id="user-name" class="text-sm text-slate-300 truncate">–</div>
        <div id="user-collection-label" class="text-xs text-ink-muted truncate">–</div>
      </div>
    </div>
    <button onclick="logout()"
      class="w-full text-sm text-ink-muted border border-ink-border rounded-lg py-1.5 px-3
             hover:border-red-500/50 hover:text-red-400 transition-colors">Log out</button>
  </div>
</aside>

<!-- ── Main ───────────────────────────────────────────────────────────── -->
<div id="main" class="flex-1 flex flex-col min-w-0 lg:ml-60">
  <header class="flex items-center justify-between px-5 py-3.5 border-b border-ink-border bg-ink-900 sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <button class="lg:hidden text-ink-muted hover:text-cyber transition-colors" onclick="openSidebar()" aria-label="Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h2 id="page-title" class="font-semibold text-base">Select a collection</h2>
    </div>
    <button id="btn-add" onclick="openAddModal()"
      class="btn-primary hidden py-2 px-4 rounded-lg text-sm cursor-pointer inline-flex items-center gap-1.5">
      <span>+ New record</span>
    </button>
  </header>

  <main class="p-5 flex-1 overflow-auto">
    <div id="loading" class="hidden flex justify-center py-16">
      <div class="w-8 h-8 border-2 border-ink-border border-t-cyber rounded-full animate-spin"></div>
    </div>
    <div id="table-area"></div>
  </main>
</div>

<!-- ── Record modal ───────────────────────────────────────────────────── -->
<div id="modal-backdrop" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
  <div id="modal" class="bg-ink-800 border border-ink-border rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col">
    <div class="flex items-center justify-between px-5 py-4 border-b border-ink-border">
      <h3 id="modal-title" class="font-semibold">New record</h3>
      <button onclick="closeModal()" class="text-ink-muted hover:text-slate-200 text-2xl leading-none transition-colors">×</button>
    </div>
    <div id="modal-body" class="p-5 overflow-y-auto flex-1"></div>
    <div class="flex justify-end gap-2 px-5 py-4 border-t border-ink-border">
      <button onclick="closeModal()"
        class="text-sm border border-ink-border rounded-lg py-2 px-4 text-slate-400 hover:text-slate-200 hover:bg-ink-700 transition-colors">Cancel</button>
      <button id="modal-save-btn" onclick="saveRecord()"
        class="btn-primary py-2 px-4 rounded-lg text-sm cursor-pointer inline-flex items-center gap-1.5">
        <span>Save</span>
      </button>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────── -->
<div id="toast" class="hidden fixed bottom-6 right-6 z-50"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  let schema = null, currentItem = null, editingRecord = null, toastTimer;
  let authToken = localStorage.getItem('cs_token') || null; // NOTE: httpOnly cookie preferred in production
  let authUser = null, authCollection = null;

  // ── HTMX: inject Bearer token on every request ─────────────────────────
  document.body.addEventListener('htmx:configRequest', e => {
    if (authToken) e.detail.headers['Authorization'] = 'Bearer ' + authToken;
  });

  // ── HTMX: after table partial swaps in ─────────────────────────────────
  document.body.addEventListener('htmx:afterSwap', e => {
    if (e.detail.target.id !== 'table-area') return;
    document.getElementById('loading').classList.add('hidden');
    e.detail.target.querySelectorAll('tbody tr').forEach((tr, i) => {
      tr.style.animationDelay = `${i * 40}ms`;
      tr.classList.add('animate__animated', 'animate__fadeIn', 'animate__faster');
    });
  });
  document.body.addEventListener('htmx:responseError', e => {
    if (e.detail.target?.id === 'table-area') {
      document.getElementById('loading').classList.add('hidden');
      toast('Failed to load data', 'error');
    }
  });

  // ── Bootstrap ─────────────────────────────────────────────────────────
  async function init() {
    try {
      schema = await fetch('/admin/schema').then(r => r.json());
    } catch { toast('Failed to load schema', 'error'); return; }

    document.getElementById('project-name').textContent = schema.name;
    populateLoginCollections();
    buildSidebar();

    if (authToken) {
      try {
        const col = getAdminCollections()[0];
        if (col) {
          const r = await apiFetch(`/auth/${toSlug(col.name)}/me`);
          if (r.ok) { authUser = await r.json(); authCollection = col.name; showApp(); return; }
        }
      } catch { /* fall through to login */ }
      authToken = null;
      localStorage.removeItem('cs_token');
    }
    showLogin();
  }

  // ── Auth ───────────────────────────────────────────────────────────────
  function getAdminCollections() {
    return (schema.userCollections || []).filter(uc => uc.admin !== false);
  }

  function populateLoginCollections() {
    const cols = getAdminCollections();
    document.getElementById('login-collection').innerHTML = cols.length
      ? cols.map(c => `<option value="${c.name}">${c.name}</option>`).join('')
      : '<option value="">No admin collections</option>';
  }

  async function doLogin() {
    const collectionName = document.getElementById('login-collection').value;
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    const btnText = btn.querySelector('span');

    errEl.classList.add('hidden');
    if (!collectionName || !email || !password) {
      errEl.textContent = 'All fields are required'; errEl.classList.remove('hidden'); return;
    }

    btn.disabled = true; btnText.textContent = 'Signing in…';

    const col = getAdminCollections().find(c => c.name === collectionName);
    if (!col) { showLoginError('Collection not found'); return; }

    try {
      const r = await fetch(`/auth/${toSlug(col.name)}/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await r.json();
      if (!r.ok) { showLoginError(data.error || 'Login failed'); return; }
      authToken = data.token; authUser = data.user; authCollection = col.name;
      localStorage.setItem('cs_token', authToken);
      showApp();
    } catch { showLoginError('Network error'); }

    function showLoginError(msg) {
      errEl.textContent = msg; errEl.classList.remove('hidden');
      btn.disabled = false; btnText.textContent = 'Sign in';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !document.getElementById('login-overlay').classList.contains('hidden')) doLogin();
  });

  function logout() {
    authToken = null; authUser = null; authCollection = null;
    localStorage.removeItem('cs_token'); currentItem = null;
    document.getElementById('table-area').innerHTML = '';
    document.getElementById('btn-add').classList.add('hidden');
    document.getElementById('page-title').textContent = 'Select a collection';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    showLogin();
  }

  function showLogin() {
    document.getElementById('login-overlay').classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
    const btn = document.getElementById('login-btn');
    btn.disabled = false; btn.querySelector('span').textContent = 'Sign in';
  }

  function showApp() {
    document.getElementById('login-overlay').classList.add('hidden');
    const name = authUser ? (authUser.name || authUser.email || '?') : '?';
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-collection-label').textContent = authCollection || '';
    document.getElementById('user-avatar').textContent = name[0].toUpperCase();
    const first = document.querySelector('.nav-item');
    if (first) first.click();
  }

  // ── Sidebar (mobile) ───────────────────────────────────────────────────
  function openSidebar() {
    document.getElementById('sidebar').classList.replace('-translate-x-full', 'translate-x-0');
    document.getElementById('sidebar-overlay').classList.remove('hidden');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.replace('translate-x-0', '-translate-x-full');
    document.getElementById('sidebar-overlay').classList.add('hidden');
  }

  // ── Sidebar nav ────────────────────────────────────────────────────────
  function buildSidebar() {
    document.getElementById('nav-user-collections').innerHTML =
      (schema.userCollections || []).map(uc =>
        `<div class="nav-item" onclick="selectItem('collection','${uc.name}',this)">👤 ${uc.name}</div>`
      ).join('');
    document.getElementById('nav-entities').innerHTML =
      (schema.entities || []).map(e =>
        `<div class="nav-item" onclick="selectItem('entity','${e.name}',this)">📦 ${e.name}</div>`
      ).join('');
  }

  function selectItem(type, name, el) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    currentItem = { type, name };
    document.getElementById('page-title').textContent = name;
    document.getElementById('btn-add').classList.remove('hidden');
    closeSidebar();
    loadTable(type, name);
  }

  function loadTable(type, name) {
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('table-area').innerHTML = '';
    htmx.ajax('GET', `/admin/partials/table?type=${type}&name=${encodeURIComponent(name)}`,
      { target: '#table-area', swap: 'innerHTML' });
  }

  function reloadTable() {
    if (currentItem) loadTable(currentItem.type, currentItem.name);
  }

  // ── Modal ──────────────────────────────────────────────────────────────
  function getCurrentSchema() {
    if (!currentItem) return null;
    return currentItem.type === 'entity'
      ? schema.entities.find(e => e.name === currentItem.name)
      : schema.userCollections.find(uc => uc.name === currentItem.name);
  }

  function getFields(isCollection) {
    const s = getCurrentSchema();
    if (!s) return [];
    const fields = isCollection
      ? [{ name: 'email', type: 'text' }, { name: 'password', type: 'text' }, ...s.properties]
      : [...s.properties];
    if (!isCollection && s.belongsTo) {
      // belongsTo entries are entity name strings (e.g. 'Post' → 'post_id')
      for (const rel of s.belongsTo) fields.push({ name: `${toSnake(String(rel))}_id`, type: 'integer' });
    }
    return fields;
  }

  function fieldHtml(f, value = '', pwd = false) {
    return `<div class="mb-4">
      <label class="block text-xs font-semibold text-ink-muted uppercase tracking-widest mb-1.5">${escHtml(f.name)}</label>
      <input type="${pwd ? 'password' : 'text'}" id="field-${f.name}" value="${escAttr(value)}" placeholder="${escAttr(f.name)}"
        class="w-full bg-ink-950 border border-ink-border rounded-lg text-slate-300 px-3 py-2.5 text-sm outline-none focus:border-cyber transition-colors"/>
    </div>`;
  }

  function openAddModal() {
    if (!currentItem) return;
    editingRecord = null;
    const isCollection = currentItem.type === 'collection';
    document.getElementById('modal-title').textContent = `New ${currentItem.name}`;
    document.getElementById('modal-body').innerHTML = getFields(isCollection).map(f => fieldHtml(f, '', f.name === 'password')).join('');
    showModal();
  }

  function openEditModal(record) {
    if (!currentItem) return;
    editingRecord = record;
    const isCollection = currentItem.type === 'collection';
    document.getElementById('modal-title').textContent = `Edit ${currentItem.name} #${record.id}`;
    document.getElementById('modal-body').innerHTML =
      getFields(isCollection).filter(f => f.name !== 'password').map(f => fieldHtml(f, String(record[f.name] ?? ''))).join('');
    showModal();
  }

  function showModal() {
    const modal = document.getElementById('modal');
    document.getElementById('modal-backdrop').classList.remove('hidden');
    modal.classList.add('animate__animated', 'animate__zoomIn', 'animate__faster');
    modal.addEventListener('animationend', () =>
      modal.classList.remove('animate__animated', 'animate__zoomIn', 'animate__faster'), { once: true });
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = false; btn.querySelector('span').textContent = 'Save';
  }

  function closeModal() {
    const modal = document.getElementById('modal');
    modal.classList.add('animate__animated', 'animate__zoomOut', 'animate__faster');
    modal.addEventListener('animationend', () => {
      document.getElementById('modal-backdrop').classList.add('hidden');
      modal.classList.remove('animate__animated', 'animate__zoomOut', 'animate__faster');
      editingRecord = null;
    }, { once: true });
  }

  async function saveRecord() {
    if (!currentItem) return;
    const isCollection = currentItem.type === 'collection';
    const fields = getFields(isCollection);
    const editFields = editingRecord ? fields.filter(f => f.name !== 'password') : fields;
    const body = {};
    for (const f of editFields) {
      const el = document.getElementById(`field-${f.name}`);
      if (el?.value) body[f.name] = el.value;
    }
    const apiPath = `/api/${toKebab(currentItem.name)}s`;
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true; btn.querySelector('span').textContent = 'Saving…';
    try {
      let r;
      if (editingRecord) {
        r = await apiFetch(`${apiPath}/${editingRecord.id}`, { method: 'PATCH', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
      } else if (isCollection) {
        r = await apiFetch(`/auth/${toSlug(currentItem.name)}/signup`, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
      } else {
        r = await apiFetch(apiPath, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
      }
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Save failed');
      toast(editingRecord ? 'Record updated' : 'Record created', 'success');
      closeModal();
      setTimeout(reloadTable, 350); // allow modal exit animation (~300 ms) to complete before reload
    } catch (e) {
      toast(e.message, 'error');
      btn.disabled = false; btn.querySelector('span').textContent = 'Save';
    }
  }

  async function deleteRecord(id) {
    if (!currentItem || !confirm(`Delete record #${id}?`)) return;
    try {
      const r = await apiFetch(`/api/${toKebab(currentItem.name)}s/${id}`, { method: 'DELETE' });
      if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'Delete failed'); }
      toast('Record deleted', 'success');
      reloadTable();
    } catch (e) { toast(e.message, 'error'); }
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function apiFetch(url, opts = {}) {
    return fetch(url, { ...opts, headers: { ...(opts.headers || {}), ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}) } });
  }

  function toast(msg, type = 'info') {
    const el = document.getElementById('toast');
    const cls = { error: 'border-red-500 text-red-400', success: 'border-cyber text-cyber', info: 'border-ink-border text-slate-300' };
    el.className = `fixed bottom-6 right-6 z-50 bg-ink-900 border rounded-xl px-4 py-3 text-sm max-w-xs animate__animated animate__slideInRight animate__faster ${cls[type] || cls.info}`;
    el.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.replace('animate__slideInRight', 'animate__slideOutRight');
      el.addEventListener('animationend', () => { el.className = 'hidden'; }, { once: true });
    }, 3000);
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }
  function toKebab(s) { return s.replace(/([A-Z])/g,(m,p,o)=>(o>0?'-':'')+p.toLowerCase()).replace(/^-/,''); }
  function toSlug(s) { return s.replace(/([A-Z])/g,(m,p,o)=>(o>0?'-':'')+p.toLowerCase()).replace(/^-/,'').replace(/[^a-z0-9-]/g,'-'); }
  function toSnake(s) { return s.replace(/([A-Z])/g,(m,p,o)=>(o>0?'_':'')+p.toLowerCase()).replace(/^_/,''); }

  init();
</script>
</body>
</html>
