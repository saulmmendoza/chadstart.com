<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChadStart Admin</title>
  <!-- Tailwind CSS v4 browser runtime (served locally from node_modules) -->
  <script src="/admin/vendor/tailwind.js"></script>
  <!-- HTMX – server-driven table loading (served locally from node_modules) -->
  <script src="/admin/vendor/htmx.min.js"></script>
  <!-- Carbon Elegance dark palette -->
  <style type="text/tailwindcss">
    @theme {
      --color-cs-bg: #121212;
      --color-cs-surface: #1e1e1e;
      --color-cs-border: #2a2a2a;
      --color-cs-primary: #bb86fc;
      --color-cs-accent: #03dac6;
      --color-cs-text: #e1e1e1;
      --color-cs-muted: #888888;
    }
  </style>
  <style>
    /* ── Sidebar nav items ────────────────────────────────────────── */
    .nav-item {
      display: block; padding: 7px 16px; font-size: .875rem; cursor: pointer;
      color: #888; border-left: 2px solid transparent;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-item:hover { background: rgba(255,255,255,.04); color: #e1e1e1; }
    .nav-item.active { background: rgba(187,134,252,.07); border-left-color: #bb86fc; color: #bb86fc; }
    /* ── Thin sidebar scrollbar ───────────────────────────────────── */
    .sidebar-nav { scrollbar-width: thin; scrollbar-color: #2a2a2a transparent; }
    /* ── Config editor tab active state ──────────────────────────── */
    .cfg-tab.active { background: rgba(187,134,252,.12); border-color: #bb86fc; color: #bb86fc; }
  </style>
</head>
<body class="bg-cs-bg text-cs-text min-h-screen flex" style="font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;">

<!-- ── Login overlay ──────────────────────────────────────────────────── -->
<div id="login-overlay" class="fixed inset-0 bg-cs-bg flex items-center justify-center z-50 p-4">
  <div class="bg-cs-surface border border-cs-border rounded p-8 w-full max-w-sm" style="box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
    <div class="font-semibold text-cs-text text-base mb-6">ChadStart Admin</div>
    <div id="login-error" class="text-red-400 text-sm mb-4 hidden"></div>

    <div id="login-collection-section" class="hidden mb-4">
      <label class="block text-sm text-cs-muted mb-1">Collection</label>
      <input type="text" id="login-collection"
        class="w-full bg-cs-bg border border-cs-border rounded text-cs-text px-3 py-2 text-sm outline-none focus:border-cs-primary" style="transition: border-color 150ms ease;"
        placeholder="Admin collection name" autocomplete="off" />
    </div>
    <div class="mb-4 text-right">
      <button type="button" id="toggle-collection-btn" onclick="toggleCollectionField()"
        class="text-xs text-cs-muted hover:text-cs-primary cursor-pointer" style="transition: color 150ms ease; background: none; border: none; padding: 0;">
        Change collection
      </button>
    </div>

    <label class="block text-sm text-cs-muted mb-1">Email</label>
    <input type="email" id="login-email" placeholder="admin@example.com" autocomplete="email"
      class="w-full bg-cs-bg border border-cs-border rounded text-cs-text px-3 py-2 text-sm mb-4 outline-none focus:border-cs-primary" style="transition: border-color 150ms ease;" />

    <label class="block text-sm text-cs-muted mb-1">Password</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"
      class="w-full bg-cs-bg border border-cs-border rounded text-cs-text px-3 py-2 text-sm mb-5 outline-none focus:border-cs-primary" style="transition: border-color 150ms ease;" />

    <button id="login-btn" onclick="doLogin()"
      class="w-full py-2 px-4 rounded text-sm cursor-pointer bg-cs-primary text-cs-bg font-medium hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed" style="transition: opacity 150ms ease;">
      <span>Sign in</span>
    </button>
  </div>
</div>

<!-- ── Mobile sidebar backdrop ────────────────────────────────────────── -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" onclick="closeSidebar()"></div>

<!-- ── Sidebar ────────────────────────────────────────────────────────── -->
<aside id="sidebar"
  class="fixed inset-y-0 left-0 z-40 w-60 bg-cs-surface border-r border-cs-border flex flex-col
         -translate-x-full lg:translate-x-0" style="transition: transform 150ms ease;">
  <div class="px-4 py-4 border-b border-cs-border">
    <div class="font-semibold text-cs-text">ChadStart</div>
    <div id="project-name" class="text-cs-muted text-xs mt-0.5">Admin</div>
  </div>

  <nav class="sidebar-nav flex-1 overflow-y-auto py-2">
    <div class="px-4 pt-3 pb-1 text-xs text-cs-muted">Collections</div>
    <div id="nav-user-collections"></div>
    <div class="px-4 pt-4 pb-1 text-xs text-cs-muted border-t border-cs-border mt-2">Entities</div>
    <div id="nav-entities"></div>
    <div class="px-4 pt-4 pb-1 text-xs text-cs-muted border-t border-cs-border mt-2">Admin</div>
    <div id="nav-admin">
      <div class="nav-item" id="nav-config-item" onclick="selectConfig(this)">⚙ Config Editor</div>
    </div>
  </nav>

  <div class="border-t border-cs-border px-4 py-3">
    <div class="flex items-center gap-2 mb-3">
      <div id="user-avatar"
        class="w-7 h-7 rounded bg-cs-border flex items-center justify-center font-medium text-xs text-cs-text shrink-0">?</div>
      <div class="min-w-0 flex-1">
        <div id="user-name" class="text-sm text-cs-text truncate">–</div>
        <div id="user-collection-label" class="text-xs text-cs-muted truncate">–</div>
      </div>
    </div>
    <button onclick="logout()"
      class="w-full text-sm text-cs-muted border border-cs-border rounded py-1.5 px-3
             hover:border-red-500/50 hover:text-red-400" style="transition: color 150ms ease, border-color 150ms ease;">Log out</button>
  </div>
</aside>

<!-- ── Main ───────────────────────────────────────────────────────────── -->
<div id="main" class="flex-1 flex flex-col min-w-0 lg:ml-60">
  <header class="flex items-center justify-between px-5 py-3 border-b border-cs-border bg-cs-surface sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <button class="lg:hidden text-cs-muted hover:text-cs-text" onclick="openSidebar()" aria-label="Menu" style="transition: color 150ms ease;">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span id="page-title" class="font-medium text-sm text-cs-text">Select a collection</span>
    </div>
    <button id="btn-add" onclick="openAddModal()"
      class="hidden py-1.5 px-3 rounded text-sm cursor-pointer border border-cs-border text-cs-text hover:bg-cs-border" style="transition: background 150ms ease;">
      + New record
    </button>
  </header>

  <main class="p-5 flex-1 overflow-auto">
    <div id="loading" class="hidden flex justify-center py-16">
      <div class="w-6 h-6 border-2 border-cs-border border-t-cs-primary rounded-full animate-spin"></div>
    </div>
    <div id="table-area"></div>

    <!-- ── Config Editor ─────────────────────────────────────────── -->
    <div id="config-area" class="hidden">
      <!-- Section tabs -->
      <div class="flex gap-1 flex-wrap mb-4 border-b border-cs-border pb-3">
        <button onclick="showConfigTab('general')"   id="cfg-tab-general"   class="cfg-tab px-3 py-1.5 text-xs rounded border border-cs-border text-cs-muted hover:text-cs-text" style="transition:color 150ms,background 150ms;">General</button>
        <button onclick="showConfigTab('entities')"  id="cfg-tab-entities"  class="cfg-tab px-3 py-1.5 text-xs rounded border border-cs-border text-cs-muted hover:text-cs-text" style="transition:color 150ms,background 150ms;">Entities</button>
        <button onclick="showConfigTab('endpoints')" id="cfg-tab-endpoints" class="cfg-tab px-3 py-1.5 text-xs rounded border border-cs-border text-cs-muted hover:text-cs-text" style="transition:color 150ms,background 150ms;">Endpoints</button>
        <button onclick="showConfigTab('files')"     id="cfg-tab-files"     class="cfg-tab px-3 py-1.5 text-xs rounded border border-cs-border text-cs-muted hover:text-cs-text" style="transition:color 150ms,background 150ms;">Files &amp; Uploads</button>
        <button onclick="showConfigTab('settings')"  id="cfg-tab-settings"  class="cfg-tab px-3 py-1.5 text-xs rounded border border-cs-border text-cs-muted hover:text-cs-text" style="transition:color 150ms,background 150ms;">Settings</button>
        <button onclick="showConfigTab('all')"       id="cfg-tab-all"       class="cfg-tab px-3 py-1.5 text-xs rounded border border-cs-border text-cs-muted hover:text-cs-text" style="transition:color 150ms,background 150ms;">All</button>
      </div>

      <!-- Section description -->
      <p id="cfg-section-desc" class="text-xs mb-3" style="color:#888;"></p>

      <!-- JSON editor -->
      <textarea id="cfg-editor"
        class="w-full bg-cs-bg border border-cs-border rounded text-cs-text px-3 py-2.5 text-xs font-mono outline-none focus:border-cs-primary resize-y"
        style="min-height:400px;transition:border-color 150ms;line-height:1.6;tab-size:2;"
        spellcheck="false"></textarea>

      <!-- Actions -->
      <div class="flex items-center gap-3 mt-4">
        <button onclick="saveConfig()"
          class="py-1.5 px-4 rounded text-sm cursor-pointer bg-cs-primary text-cs-bg font-medium hover:opacity-90 disabled:opacity-50"
          id="cfg-save-btn" style="transition:opacity 150ms;">Save Config</button>
        <button onclick="resetConfigTab()"
          class="text-sm border border-cs-border rounded py-1.5 px-4 text-cs-muted hover:text-cs-text hover:bg-cs-border" style="transition:color 150ms,background 150ms;">Reset</button>
        <span id="cfg-status" class="text-xs" style="color:#888;"></span>
      </div>

      <!-- S3 info note -->
      <div id="cfg-s3-note" class="hidden mt-4 p-3 rounded border text-xs" style="border-color:#2a2a2a;color:#888;">
        <strong style="color:#e1e1e1;">S3 Storage</strong> is configured via environment variables:<br>
        <code style="color:#bb86fc;">S3_BUCKET</code>, <code style="color:#bb86fc;">S3_ENDPOINT</code>,
        <code style="color:#bb86fc;">S3_REGION</code>, <code style="color:#bb86fc;">S3_ACCESS_KEY_ID</code>,
        <code style="color:#bb86fc;">S3_SECRET_ACCESS_KEY</code>.<br>
        Set these in your <code style="color:#bb86fc;">.env</code> file or deployment environment.
      </div>
    </div>
  </main>
</div>

<!-- ── Record modal ───────────────────────────────────────────────────── -->
<div id="modal-backdrop" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
  <div id="modal" class="bg-cs-surface border border-cs-border rounded w-full max-w-lg max-h-[90vh] flex flex-col" style="box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
    <div class="flex items-center justify-between px-5 py-3 border-b border-cs-border">
      <span id="modal-title" class="font-medium text-sm">New record</span>
      <button onclick="closeModal()" class="text-cs-muted hover:text-cs-text text-xl leading-none" style="transition: color 150ms ease;">×</button>
    </div>
    <div id="modal-body" class="p-5 overflow-y-auto flex-1"></div>
    <div class="flex justify-end gap-2 px-5 py-3 border-t border-cs-border">
      <button onclick="closeModal()"
        class="text-sm border border-cs-border rounded py-1.5 px-4 text-cs-muted hover:text-cs-text hover:bg-cs-border" style="transition: color 150ms ease, background 150ms ease;">Cancel</button>
      <button id="modal-save-btn" onclick="saveRecord()"
        class="py-1.5 px-4 rounded text-sm cursor-pointer bg-cs-primary text-cs-bg font-medium hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed" style="transition: opacity 150ms ease;">
        <span>Save</span>
      </button>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────────── -->
<div id="toast" class="hidden fixed bottom-6 right-6 z-50"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  let schema = null, currentItem = null, editingRecord = null, toastTimer;
  let authToken = localStorage.getItem('cs_token') || null; // NOTE: httpOnly cookie preferred in production
  let authUser = null, authCollection = null;

  // ── HTMX: inject Bearer token on every request ─────────────────────────
  document.body.addEventListener('htmx:configRequest', e => {
    if (authToken) e.detail.headers['Authorization'] = 'Bearer ' + authToken;
  });

  // ── HTMX: after table partial swaps in ─────────────────────────────────
  document.body.addEventListener('htmx:afterSwap', e => {
    if (e.detail.target.id !== 'table-area') return;
    document.getElementById('loading').classList.add('hidden');
  });
  document.body.addEventListener('htmx:responseError', e => {
    if (e.detail.target?.id === 'table-area') {
      document.getElementById('loading').classList.add('hidden');
      toast('Failed to load data', 'error');
    }
  });

  // ── Bootstrap ─────────────────────────────────────────────────────────
  async function init() {
    try {
      schema = await fetch('/admin/schema').then(r => r.json());
    } catch { toast('Failed to load schema', 'error'); return; }

    document.getElementById('project-name').textContent = schema.name;
    populateLoginCollections();
    buildSidebar();

    if (authToken) {
      try {
        const col = getAdminCollections()[0];
        if (col) {
          const r = await apiFetch(`/api/auth/${toSlug(col.name)}/me`);
          if (r.ok) { authUser = await r.json(); authCollection = col.name; showApp(); return; }
        }
      } catch { /* fall through to login */ }
      authToken = null;
      localStorage.removeItem('cs_token');
    }
    showLogin();
  }

  // ── Auth ───────────────────────────────────────────────────────────────
  function getAdminCollections() {
    return (schema.entities || []).filter(e => e.authenticable && e.admin !== false);
  }

  function populateLoginCollections() {
    const cols = getAdminCollections();
    const input = document.getElementById('login-collection');
    if (cols.length) {
      input.value = cols[0].name;
    } else {
      input.value = '';
      const errEl = document.getElementById('login-error');
      errEl.textContent = 'No admin collections configured'; errEl.classList.remove('hidden');
      document.getElementById('login-btn').disabled = true;
    }
  }

  function toggleCollectionField() {
    const section = document.getElementById('login-collection-section');
    const btn = document.getElementById('toggle-collection-btn');
    const isHidden = section.classList.contains('hidden');
    section.classList.toggle('hidden', !isHidden);
    btn.textContent = isHidden ? 'Hide collection' : 'Change collection';
    if (isHidden) document.getElementById('login-collection').focus();
  }

  async function doLogin() {
    const collectionName = document.getElementById('login-collection').value.trim().replace(/[^a-zA-Z0-9 _-]/g, '');
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    const btnText = btn.querySelector('span');

    errEl.classList.add('hidden');
    if (!collectionName || !email || !password) {
      errEl.textContent = 'All fields are required'; errEl.classList.remove('hidden'); return;
    }

    btn.disabled = true; btnText.textContent = 'Signing in…';

    const col = getAdminCollections().find(c => c.name === collectionName);
    if (!col) { showLoginError('Collection not found'); return; }

    try {
      const r = await fetch(`/api/auth/${toSlug(col.name)}/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await r.json();
      if (!r.ok) { showLoginError(data.error || 'Login failed'); return; }
      authToken = data.token; authUser = data.user; authCollection = col.name;
      localStorage.setItem('cs_token', authToken);
      showApp();
    } catch { showLoginError('Network error'); }

    function showLoginError(msg) {
      errEl.textContent = msg; errEl.classList.remove('hidden');
      btn.disabled = false; btnText.textContent = 'Sign in';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !document.getElementById('login-overlay').classList.contains('hidden')) doLogin();
  });

  function logout() {
    authToken = null; authUser = null; authCollection = null;
    localStorage.removeItem('cs_token'); currentItem = null;
    document.getElementById('table-area').innerHTML = '';
    document.getElementById('btn-add').classList.add('hidden');
    document.getElementById('page-title').textContent = 'Select a collection';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    showLogin();
  }

  function showLogin() {
    document.getElementById('login-overlay').classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
    const btn = document.getElementById('login-btn');
    btn.disabled = false; btn.querySelector('span').textContent = 'Sign in';
  }

  function showApp() {
    document.getElementById('login-overlay').classList.add('hidden');
    const name = authUser ? (authUser.name || authUser.email || '?') : '?';
    document.getElementById('user-name').textContent = name;
    document.getElementById('user-collection-label').textContent = authCollection || '';
    document.getElementById('user-avatar').textContent = name[0].toUpperCase();
    const first = document.querySelector('.nav-item');
    if (first) first.click();
  }

  // ── Sidebar (mobile) ───────────────────────────────────────────────────
  function openSidebar() {
    document.getElementById('sidebar').classList.replace('-translate-x-full', 'translate-x-0');
    document.getElementById('sidebar-overlay').classList.remove('hidden');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.replace('translate-x-0', '-translate-x-full');
    document.getElementById('sidebar-overlay').classList.add('hidden');
  }

  // ── Sidebar nav ────────────────────────────────────────────────────────
  function buildSidebar() {
    document.getElementById('nav-user-collections').innerHTML =
      (schema.userCollections || []).map(uc =>
        `<div class="nav-item" onclick="selectItem('collection','${uc.name}',this)">${uc.name}</div>`
      ).join('');
    document.getElementById('nav-entities').innerHTML =
      (schema.entities || []).map(e =>
        `<div class="nav-item" onclick="selectItem('entity','${e.name}',this)">${e.name}</div>`
      ).join('');
  }

  function selectItem(type, name, el) {
    configMode = false;
    document.getElementById('config-area').classList.add('hidden');
    document.getElementById('table-area').classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    currentItem = { type, name };
    document.getElementById('page-title').textContent = name;
    document.getElementById('btn-add').classList.remove('hidden');
    closeSidebar();
    loadTable(type, name);
  }

  function loadTable(type, name) {
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('table-area').innerHTML = '';
    htmx.ajax('GET', `/admin/partials/table?type=${type}&name=${encodeURIComponent(name)}`,
      { target: '#table-area', swap: 'innerHTML' });
  }

  function reloadTable() {
    if (currentItem) loadTable(currentItem.type, currentItem.name);
  }

  // ── Modal ──────────────────────────────────────────────────────────────
  function getCurrentSchema() {
    if (!currentItem) return null;
    return currentItem.type === 'entity'
      ? schema.entities.find(e => e.name === currentItem.name)
      : schema.userCollections.find(uc => uc.name === currentItem.name);
  }

  function getFields(isCollection) {
    const s = getCurrentSchema();
    if (!s) return [];
    const fields = isCollection
      ? [{ name: 'email', type: 'text' }, { name: 'password', type: 'text' }, ...s.properties]
      : [...s.properties];
    if (!isCollection && s.belongsTo) {
      // belongsTo entries are entity name strings (e.g. 'Post' → 'post_id')
      for (const rel of s.belongsTo) fields.push({ name: `${toSnake(String(rel))}_id`, type: 'integer' });
    }
    return fields;
  }

  function fieldHtml(f, value = '', pwd = false) {
    return `<div class="mb-4">
      <label class="block text-sm text-cs-muted mb-1">${escHtml(f.name)}</label>
      <input type="${pwd ? 'password' : 'text'}" id="field-${f.name}" value="${escAttr(value)}" placeholder="${escAttr(f.name)}"
        class="w-full bg-cs-bg border border-cs-border rounded text-cs-text px-3 py-2 text-sm outline-none focus:border-cs-primary" style="transition: border-color 150ms ease;"/>
    </div>`;
  }

  function openAddModal() {
    if (!currentItem) return;
    editingRecord = null;
    const isCollection = currentItem.type === 'collection';
    document.getElementById('modal-title').textContent = `New ${currentItem.name}`;
    document.getElementById('modal-body').innerHTML = getFields(isCollection).map(f => fieldHtml(f, '', f.name === 'password')).join('');
    showModal();
  }

  function openEditModal(record) {
    if (!currentItem) return;
    editingRecord = record;
    const isCollection = currentItem.type === 'collection';
    document.getElementById('modal-title').textContent = `Edit ${currentItem.name} #${record.id}`;
    document.getElementById('modal-body').innerHTML =
      getFields(isCollection).filter(f => f.name !== 'password').map(f => fieldHtml(f, String(record[f.name] ?? ''))).join('');
    showModal();
  }

  function showModal() {
    document.getElementById('modal-backdrop').classList.remove('hidden');
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = false; btn.querySelector('span').textContent = 'Save';
  }

  function closeModal() {
    document.getElementById('modal-backdrop').classList.add('hidden');
    editingRecord = null;
  }

  async function saveRecord() {
    if (!currentItem) return;
    const isCollection = currentItem.type === 'collection';
    const fields = getFields(isCollection);
    const editFields = editingRecord ? fields.filter(f => f.name !== 'password') : fields;
    const body = {};
    for (const f of editFields) {
      const el = document.getElementById(`field-${f.name}`);
      if (el?.value) body[f.name] = el.value;
    }
    const apiPath = `/api/${toKebab(currentItem.name)}s`;
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true; btn.querySelector('span').textContent = 'Saving…';
    try {
      let r;
      if (editingRecord) {
        r = await apiFetch(`${apiPath}/${editingRecord.id}`, { method: 'PATCH', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
      } else if (isCollection) {
        r = await apiFetch(`/api/auth/${toSlug(currentItem.name)}/signup`, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
      } else {
        r = await apiFetch(apiPath, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } });
      }
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Save failed');
      toast(editingRecord ? 'Record updated' : 'Record created', 'success');
      closeModal();
      reloadTable();
    } catch (e) {
      toast(e.message, 'error');
      btn.disabled = false; btn.querySelector('span').textContent = 'Save';
    }
  }

  async function deleteRecord(id) {
    if (!currentItem || !confirm(`Delete record #${id}?`)) return;
    try {
      const r = await apiFetch(`/api/${toKebab(currentItem.name)}s/${id}`, { method: 'DELETE' });
      if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'Delete failed'); }
      toast('Record deleted', 'success');
      reloadTable();
    } catch (e) { toast(e.message, 'error'); }
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function apiFetch(url, opts = {}) {
    return fetch(url, { ...opts, headers: { ...(opts.headers || {}), ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}) } });
  }

  function toast(msg, type = 'info') {
    const el = document.getElementById('toast');
    const cls = { error: 'border-red-500/60 text-red-400', success: 'border-cs-primary/60 text-cs-primary', info: 'border-cs-border text-cs-text' };
    el.className = `fixed bottom-5 right-5 z-50 bg-cs-surface border rounded px-4 py-2.5 text-sm max-w-xs ${cls[type] || cls.info}`;
    el.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
    el.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'hidden'; }, 3000);
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }
  function toKebab(s) { return s.replace(/([A-Z])/g,(m,p,o)=>(o>0?'-':'')+p.toLowerCase()).replace(/^-/,''); }
  function toSlug(s) { return s.replace(/([A-Z])/g,(m,p,o)=>(o>0?'-':'')+p.toLowerCase()).replace(/^-/,'').replace(/[^a-z0-9-]/g,'-'); }
  function toSnake(s) { return s.replace(/([A-Z])/g,(m,p,o)=>(o>0?'_':'')+p.toLowerCase()).replace(/^_/,''); }

  // ── Config Editor ─────────────────────────────────────────────────────
  let configMode = false;
  let configData = null;     // full config object from server
  let configActiveTab = 'general';

  const CFG_TABS = {
    general:   { keys: ['name', 'port', 'database', 'public'],  desc: 'Application name, port, database path, and public static folder.' },
    entities:  { keys: ['entities'],  desc: 'Entity definitions including properties, relations, access policies, webhooks, and middlewares.' },
    endpoints: { keys: ['endpoints'], desc: 'Custom REST endpoint definitions (path, method, handler, policies).' },
    files:     { keys: ['files'],     desc: 'File bucket definitions for local uploads.', s3: true },
    settings:  { keys: ['settings', 'groups'], desc: 'API rate limits and reusable property groups.' },
    all:       { keys: null,          desc: 'Full configuration — all sections combined.' },
  };

  function selectConfig(el) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    configMode = true;
    document.getElementById('page-title').textContent = 'Config Editor';
    document.getElementById('btn-add').classList.add('hidden');
    document.getElementById('table-area').classList.add('hidden');
    document.getElementById('config-area').classList.remove('hidden');
    loadConfig();
  }

  async function loadConfig() {
    document.getElementById('cfg-status').textContent = 'Loading…';
    try {
      const r = await apiFetch('/admin/config');
      if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'Failed to load'); }
      configData = await r.json();
      showConfigTab(configActiveTab);
      document.getElementById('cfg-status').textContent = '';
    } catch (e) {
      document.getElementById('cfg-status').textContent = 'Error: ' + e.message;
      toast('Failed to load config: ' + e.message, 'error');
    }
  }

  function showConfigTab(tab) {
    configActiveTab = tab;
    document.querySelectorAll('.cfg-tab').forEach(t => t.classList.remove('active'));
    const tabEl = document.getElementById('cfg-tab-' + tab);
    if (tabEl) tabEl.classList.add('active');

    const def = CFG_TABS[tab] || CFG_TABS.all;
    document.getElementById('cfg-section-desc').textContent = def.desc || '';

    const s3Note = document.getElementById('cfg-s3-note');
    if (def.s3) { s3Note.classList.remove('hidden'); } else { s3Note.classList.add('hidden'); }

    let data;
    if (!def.keys) {
      data = configData || {};
    } else {
      data = {};
      for (const key of def.keys) {
        if (configData && configData[key] !== undefined) data[key] = configData[key];
      }
    }
    document.getElementById('cfg-editor').value = JSON.stringify(data, null, 2);
  }

  async function saveConfig() {
    const rawText = document.getElementById('cfg-editor').value.trim();
    let sectionData;
    try {
      sectionData = JSON.parse(rawText);
    } catch (e) {
      toast('Invalid JSON: ' + e.message, 'error');
      return;
    }
    if (typeof sectionData !== 'object' || Array.isArray(sectionData) || sectionData === null) {
      toast('Config must be a JSON object', 'error');
      return;
    }

    // Merge section data into full config.
    // For non-'all' tabs, remove all keys belonging to this section first
    // so that keys the user deleted from the editor are properly removed.
    let fullConfig;
    if (configActiveTab === 'all') {
      fullConfig = sectionData;
    } else {
      fullConfig = Object.assign({}, configData || {});
      const tabKeys = CFG_TABS[configActiveTab].keys || [];
      for (const key of tabKeys) delete fullConfig[key];
      Object.assign(fullConfig, sectionData);
    }

    const btn = document.getElementById('cfg-save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    document.getElementById('cfg-status').textContent = '';

    try {
      const r = await apiFetch('/admin/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(fullConfig),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Save failed');
      configData = fullConfig;

      if (data.reloading) {
        document.getElementById('cfg-status').textContent = 'Reloading…';
        toast('Config saved — reloading server…', 'info');
        // Re-fetch schema after the server has rebuilt its routes
        setTimeout(async () => {
          try {
            schema = await fetch('/admin/schema').then(r => r.json());
            document.getElementById('project-name').textContent = schema.name;
            buildSidebar();
            document.getElementById('cfg-status').textContent = '✓ Config applied.';
            toast('Config applied', 'success');
          } catch {
            document.getElementById('cfg-status').textContent = '✓ Saved — reload the page to see changes.';
          }
        }, 800);
      } else {
        document.getElementById('cfg-status').textContent = '✓ Saved — restart the server to apply changes.';
        toast('Config saved successfully', 'success');
      }
    } catch (e) {
      toast('Save failed: ' + e.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Save Config';
    }
  }

  function resetConfigTab() {
    if (!configData) return;
    showConfigTab(configActiveTab);
    toast('Reset to last saved state', 'info');
  }

  init();
</script>
</body>
</html>
