services:
  app:
    image: ghcr.io/saulmmendoza/chadstart.com:latest
    # build: .  # uncomment to build locally instead
    # command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ./chadstart.yaml:/app/chadstart.yaml:ro
      - ./data:/app/data
      - ./public:/app/public
      - ./functions:/app/functions:ro
    restart: unless-stopped
